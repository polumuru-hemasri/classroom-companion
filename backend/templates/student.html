<!DOCTYPE html>
<html>
<head>
    <title>Student Dashboard</title>
    <style>
body{
    font-family: Arial, sans-serif;
    margin: 30px;
}

table{
    border-collapse: collapse;
    width: 100%;
}

th, td{
    border: 1px solid black;
    padding: 10px;
    text-align: left;
}

th{
    background-color: #f2f2f2;
}

h1{
    color: #2c3e50;
}
</style>
</head>
<body>

<h1>Student Dashboard</h1>
<h3>Welcome, {{ student_name }}</h3>
<table border="1" cellpadding="10">

<tr>
    <th>Student</th>
    <th>Assignment</th>
    <th>Deadline</th>
    <th>Status</th>
    <th>Feedback</th>
</tr>

{% for item in data %}

<tr>
    <td>{{ item.student }}</td>
    <td>{{ item.assignment }}</td>
    <td>{{ item.deadline }}</td>
    <td>{{ item.status }}</td>
    <td>{{ item.feedback }}</td>
</tr>

{% endfor %}

</table>

</body>
</html>
